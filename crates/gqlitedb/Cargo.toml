[package]
name = "gqlitedb"
description = "GQLite is a Rust-language library, with a C interface, that implements a small, fast, self-contained, high-reliability, full-featured, Graph Query database engine."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["redb", "capi", "sqlite"]
capi = []
redb = ["dep:redb"]
pgql = ["dep:pgrx"]
pg12 = ["pgrx/pg12"]
pg13 = ["pgrx/pg13"]
pg14 = ["pgrx/pg14"]
pg15 = ["pgrx/pg15"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
sqlite = ["dep:rusqlite", "dep:askama"]

[dependencies]
askama = { version = "0.12", optional = true }
ciborium = "0.2"
itertools = "0.14"
pgrx = { version = "0.12", optional = true }
pest = "2"
pest_derive = "2"
rand = "0.9"
redb = { version = "2", optional = true }
serde = "1"
serde_json = "1"
rusqlite = { version = "0.33", optional = true, features = ["uuid"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
