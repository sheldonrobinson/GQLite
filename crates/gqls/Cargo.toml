[package]
name = "gqls"
description = "GQL Schema, with support for ORB-style API generation."
readme = "README.MD"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["gqlite"]
gqlite = ["dep:gqlitedb"]
rune = ["dep:rune", "dep:gqliterune"]
bundled = ["gqlitedb/bundled"]

[dependencies]
gqlitedb = { workspace = true, optional = true }
gqb.workspace = true
gqls-macros.workspace = true
graphcore.workspace = true

anyhow = "1"
rune = { workspace = true, optional = true }
gqliterune = { workspace = true, optional = true }

[dev-dependencies]

ccutils = { workspace = true, features = ["rune", "testing"] }
