tasks:
  prepare_ext:
    description: "Prepare GQLite Ruby ext"
    arguments: []
    command: !commands
      - clean
      - rune: |
          let ext_dir = "ext";
          let root_dir = yet::path_join([env.cwd(), "..", ".."]);
          let gqliterb_dir = yet::path_join([ext_dir, "gqliterb"]);
          let gqlitedb_dir = yet::path_join([ext_dir, "gqlitedb"]);
          let graphcore_dir = yet::path_join([ext_dir, "graphcore"]);
          let gqliterb_src_dir = yet::path_join([env.cwd(), "gqliterb"]);
          let gqlitedb_src_dir = yet::path_join([root_dir, "crates", "gqlitedb"]);
          let graphcore_src_dir = yet::path_join([root_dir, "crates", "graphcore"]);

          let extconf_source = "extconf.rb";

          println!("🧹 Cleaning directories");
          env.rm_rf(gqliterb_dir);
          env.rm_rf(gqlitedb_dir);
          env.rm_rf(graphcore_dir);

          println!("📦 Copying crates {gqliterb_src_dir} {gqliterb_dir}");
          env.execute(format!("cp -r {gqliterb_src_dir} {gqliterb_dir}"))?;
          env.execute(format!("cp -r {gqlitedb_src_dir} {gqlitedb_dir}"))?;
          env.execute(format!("cp -r {graphcore_src_dir} {graphcore_dir}"))?;
          // env.cp_r(gqliterb_src_dir, gqliterb_dir);
          // env.cp_r(gqlitedb_dir, gqlitedb_dir);
          // env.cp_r(graphcore_src_dir, graphcore_dir);

          println!("📄 Copying extconf.rb");
          env.cp(extconf_source, gqliterb_dir)?

  build_gem:
    command: !commands
      - prepare_ext
      - gem build gqliterb.gemspec
      - mkdir -p pkg
      - mv *.gem pkg

  clean:
    command: !commands
      - rm -rf "pkg/"
