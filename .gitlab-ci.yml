# Prevent two pipelines to run for a merge request and for wip branches
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME =~ /wip\/.*/
      when: always
    - if: $CI_COMMIT_REF_NAME =~ /wip\/.*/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH

stages: # List of stages for jobs, and their order of execution
  - precheck
  - build
  - test
  - benchmark
  - postcheck

include:
  - project: "cyloncore/cc_ci_templates"
    file: "/scripts-ci.yml"
    ref: "stable"

.build_template: &build_definition
  script:
    - mkdir build
    - pushd build
    - cmake .. -DCMAKE_INSTALL_PREFIX=../inst -DGQLITE_TESTS_OUTPUT_JUNIT=ON -DGQLITE_TESTS_DISABLE_RUST_TESTS=ON
    - make -j8 install
    - popd
  artifacts:
    paths:
      - build/
      - inst/
    expire_in: 1day

.test_template: &test_definition
  script:
    - pwd
    - ls
    # Export installation
    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/inst/lib
    - export RUBYLIB=$RUBYLIB:`pwd`/inst/lib/ruby
    - export PYTHON3_VERSION=`python3 -c "import sys; print(str(sys.version_info.major) + '.' + str(sys.version_info.minor), end='');"`
    - export PYTHONPATH=$PYTHONPATH:`pwd`/inst/lib/python$PYTHON3_VERSION/dist-packages
    - echo $RUBYLIB
    - echo $PYTHONPATH
    - pushd build
    - make test
    - popd
    - cargo nextest run
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/Testing
    reports:
      junit:
        - build/Testing/junit/*.xml
        - build/Testing/junit/*/*.xml
        - target/nextest/default/junit.xml

precheck:
  stage: precheck
  extends:
    - .cc_retrieve_scripts
    - .cc_check_binary_files
    - .cc_check_commit_message
  script:
    - echo "Pre-check are running."
  variables:
    CC_CI_REF_BRANCH: "dev/2"

# Extra-tests
doc:
  stage: postcheck
  image: cyloncore/ci:debian
  script:
    - cargo doc --no-deps
  needs:
    - job: "debian:build"
      artifacts: true

semver:
  stage: postcheck
  image: cyloncore/ci:debian
  script:
    - cargo semver-checks --exclude gqliterb --exclude gqlitepy
  needs:
    - job: "debian:build"
      artifacts: true

coverage:
  stage: postcheck
  image: cyloncore/ci:debian
  script:
    - cargo llvm-cov
  needs:
    - job: "debian:build"
      artifacts: true

dists:
  stage: postcheck
  image: cyloncore/ci:debian
  script:
    - pushd bindings/ruby
    - rake prepare:ext
    - rake gem
    - popd
    - pushd bindings/python/gqlitepy
    - CARGO_TARGET_DIR=`pwd` maturin sdist
    - popd
  needs:
    - job: "debian:build"
      artifacts: true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - bindings/ruby/pkg/gqlite-*.gem
      - bindings/python/gqlitepy/wheels/gqlitedb-*.tar.gz

test_ruby_gem:
  stage: postcheck
  image: cyloncore/ci:ruby
  script:
    - gem install bindings/ruby/pkg/gqlite-*.gem
    - rspec tests/rb/gqlite-rspec.rb
  needs:
    - job: "dists"
      artifacts: true

test_python_src_wheels:
  stage: postcheck
  image: python:3.9
  script:
    - pip3 install bindings/python/gqlitepy/wheels/gqlitedb-*.tar.gz
    - python3 tests/py/python-unittest.py
  needs:
    - job: "dists"
      artifacts: true

benchmarks:
  stage: benchmark
  image: cyloncore/ci:debian-arm64
  variables:
    TMP_BENCH_FILE: bench_output.tmp
    TARGET_REPO: git@gitlab.com:GQLite/benchmark-results.git
  before_script:
    # Prepare SSH key
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    # Add known hosts (GitLab.com or your Git host)
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

    # Optional: check ssh works
    - ssh -T git@gitlab.com || true
  script:
    - echo "🚀 Run benchmarks..."
    - cargo bench -p gqlitedb | tee $TMP_BENCH_FILE

    - echo "🧬 Clone $TARGET_REPO"
    - git clone $TARGET_REPO results_repo
    - mkdir -p results_repo/${CI_COMMIT_SHA}
    - pushd results_repo
    - git config user.email "ci-bot@auksys.org"
    - git config user.name "CI Bot"
    - popd

    - echo "💾 Export results to $TARGET_REPO"
    - cat $TMP_BENCH_FILE | ruby scripts/export_divan.rb "results_repo/$CI_COMMIT_SHA/$CI_PIPELINE_ID"

    - echo "📤 Commit and push results to $TARGET_REPO"
    - pushd results_repo
    - git add ${CI_COMMIT_SHA}/${CI_PIPELINE_ID}.txt ${CI_COMMIT_SHA}/${CI_PIPELINE_ID}.csv
    - git commit -m "Add benchmark results for commit $CI_COMMIT_SHA pipeline $CI_PIPELINE_ID"
    - git push origin main
    - popd

  needs:
    - job: precheck
  tags:
    - bench
  dependencies: []

# Debian
debian:build:
  image: cyloncore/ci:debian
  stage: build
  <<: *build_definition

debian:test: # This job runs in the test stage.
  image: cyloncore/ci:debian
  stage: test # It only starts when the job in the build stage completes successfully.
  needs:
    - job: "debian:build"
      artifacts: true
  <<: *test_definition

# Ubuntu
ubuntu:build:
  image: cyloncore/ci:ubuntu-noble
  stage: build
  <<: *build_definition

ubuntu:test: # This job runs in the test stage.
  image: cyloncore/ci:ubuntu-noble
  stage: test # It only starts when the job in the build stage completes successfully.
  needs:
    - job: "ubuntu:build"
      artifacts: true
  <<: *test_definition

# Fedora
fedora:build:
  image: cyloncore/ci:fedora
  stage: build
  <<: *build_definition

fedora:test: # This job runs in the test stage.
  image: cyloncore/ci:fedora
  stage: test # It only starts when the job in the build stage completes successfully.
  needs:
    - job: "fedora:build"
      artifacts: true
  <<: *test_definition
