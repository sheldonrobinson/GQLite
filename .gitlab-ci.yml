stages:          # List of stages for jobs, and their order of execution
  - build
  - test

.build_template: &build_definition
  script:
    - mkdir build
    - pushd build
    - cmake .. -DCMAKE_INSTALL_PREFIX=../inst -DGQLITE_TESTS_OUTPUT_JUNIT=ON
    - make -j8 install
    - popd
  artifacts:
    paths:
      - build/
      - inst/
    expire_in: 1day

.test_template: &test_definition
  script:
    - pwd
    - ls
    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:`pwd`/inst/lib
    - export RUBYLIB=$RUBYLIB:`pwd`/inst/lib/ruby
    - export PYTHON3_VERSION=`python3 -c "import sys; print(str(sys.version_info.major) + '.' + str(sys.version_info.minor), end='');"`
    - export PYTHONPATH=$PYTHONPATH:`pwd`/inst/lib/python$PYTHON3_VERSION/dist-packages
    - echo $RUBYLIB
    - echo $PYTHONPATH
    - pushd build
    - make test
    - popd
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - build/Testing
    reports:
      junit: build/Testing/junit/*.xml

# Debian
debian:build:
  image: cyrilleberger/cyloncore-ci:debian
  stage: build
  <<: *build_definition

debian:test:   # This job runs in the test stage.
  image: cyrilleberger/cyloncore-ci:debian
  stage: test    # It only starts when the job in the build stage completes successfully.
  needs:
    - job: "debian:build"
      artifacts: true
  <<: *test_definition

# Ubuntu
ubuntu:build:
